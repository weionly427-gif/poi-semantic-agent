<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航语义测试台</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#1c3026;background:#f8faf8;font:16px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{height:68px;background:white;border-bottom:1px solid #dce4dd;display:flex;align-items:center;padding:0 max(6vw,20px);gap:12px;font-weight:650}header b{background:#19583e;color:white;border-radius:9px;width:32px;height:32px;text-align:center;line-height:32px}main{max-width:1040px;margin:55px auto;padding:0 24px}h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;margin:0}p{color:#58685f;margin:6px 0 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{border:1px solid #d9e2db;border-radius:16px;padding:25px;background:white;min-width:0}h2,label{font-size:17px;font-weight:650;margin:0}textarea,pre{display:block;width:100%;border-radius:10px;margin:18px 0;padding:15px;font-size:15px}textarea{resize:vertical;font-family:inherit;min-height:146px;border:1px solid #aab9af;line-height:1.7}textarea:focus,button:focus-visible{outline:2px solid #27724d;outline-offset:2px}pre{background:#f2f6f2;min-height:205px;white-space:pre-wrap;overflow-wrap:anywhere;color:#30523d;font:14px/1.65 Consolas,monospace}button{font:inherit;font-size:14px;border:1px solid #cad7cc;background:white;color:#23583d;border-radius:8px;padding:7px 12px;cursor:pointer}button:disabled{opacity:.55;cursor:default}.primary{background:#19583e;color:white;border-color:#19583e}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{margin-top:22px}.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}small{color:#57685d}#status{margin-top:15px;display:block}details{margin-top:20px}summary{cursor:pointer}li{margin:8px 0}@media(max-width:680px){.grid{grid-template-columns:1fr}main{margin:28px auto}section{padding:19px}}
.release{font-size:13px;font-weight:500;color:#52685a;white-space:nowrap;font-variant-numeric:tabular-nums}input{display:block;width:100%;border:1px solid #aab9af;border-radius:8px;padding:9px;font:inherit}.location{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.location label{font-size:14px;flex:1;min-width:130px}#places{margin-top:20px}#places p{margin:6px 0}#places li small{display:block}</style><header><b aria-hidden="true">↗</b>导航助手 <small class="release">2026-11-11-3</small></header><main><h1>导航语义测试台 · 非导航态</h1><p>输入一句导航需求，查看解析结果。继续输入可测试补充、改口和取消。</p>
<div class="location"><label>测试城市<input id="city" maxlength="80" placeholder="例如：上海"></label><label>当前位置附近的地标<input id="anchor" maxlength="120" placeholder="例如：中山公园"></label></div><div class="grid"><section><div class="top"><label for="cmd">输入指令</label><small id="turn">第 1 轮</small></div><textarea id="cmd" maxlength="4000" placeholder="例如：帮我推荐中山公园附近的美食"></textarea><div class="row" id="examples"><small>试一试</small><button data-text="帮我推荐中山公园附近的美食">公园附近美食</button><button data-text="附近找家咖啡店，必须能停车">附近咖啡店</button></div><div class="row actions"><button class="primary" id="go">解析指令</button></div><small role="status" id="status">等待输入</small><p id="question" role="status" hidden style="margin:16px 0 0;color:#19583e;font-weight:600"></p></section>
<section><div class="top"><h2>语义 JSON</h2><button id="copy" disabled>复制</button></div><pre id="out">解析结果将在这里显示</pre></section></div><section id="places" hidden aria-live="polite"><h2>高德推荐地点</h2><p id="placeStatus"></p><ol id="placeList"></ol></section><details id="log" hidden><summary>本次对话记录</summary><ol id="history"></ol></details></main>
<script>
const el=id=>document.getElementById(id);let previous=null,count=0;
let candidates=[];
function showPlaces(search) {
  candidates=search.places;
  el('places').hidden=!search.message;
  el('placeStatus').textContent=search.message;
  const rows=candidates.map(place=>{
    const li=document.createElement('li'), detail=document.createElement('small');
    li.textContent=place.name;
    detail.textContent=[place.address,place.distance==null?'':'距搜索中心 '+place.distance+' 米'].filter(Boolean).join(' · ');
    li.append(detail);
    return li;
  });
  el('placeList').replaceChildren(...rows);
}
const controls=[...document.querySelectorAll('button,textarea,input')];
function busy(on){controls.forEach(x=>x.disabled=on);el('copy').disabled=on||!count}
el('examples').onclick=e=>{if(e.target.dataset.text){el('cmd').value=e.target.dataset.text;el('cmd').focus()}};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('out').textContent);el('status').textContent='JSON 已复制'}catch{el('status').textContent='请选中结果后复制'}};
el('go').onclick=async()=>{const text=el('cmd').value.trim();if(!text){el('cmd').focus();return}busy(true);el('status').textContent='正在解析…';try{const r=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,previous,home:{city:el('city').value,anchor:el('anchor').value,candidates}})});const payload=await r.json();if(!r.ok)throw Error(payload.error);const data=payload.frame;if(!['select','details'].includes(data.intent))showPlaces(payload.search);if(data.intent==='reset_session'){el('history').replaceChildren();count=0}previous=data;count++;el('out').textContent=JSON.stringify(data,null,2);const item=document.createElement('li');item.textContent=text;el('history').append(item);el('log').hidden=false;el('turn').textContent='第 '+(count+1)+' 轮';el('status').textContent='第 '+count+' 轮 · '+({new_task:'新任务',continue_task:'继续当前任务',cancel:'已取消',reset:'已重置'}[data.dialogue?.relation]||'解析完成');el('question').hidden=!data.follow_up;el('question').textContent=data.follow_up||'';el('cmd').value=''}catch(e){el('status').textContent='解析失败：'+e.message+(previous?'。右侧保留上轮结果。':'')}finally{busy(false);el('cmd').focus()}};
el('cmd').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')el('go').click()};
if(location.protocol==='file:'){busy(true);el('status').textContent='请运行同目录的“启动测试网页.cmd”，通过本地服务访问。'}
</script></html>
