<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航助手</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#19372d;background:#f6f7f3;font:16px/1.55 "Microsoft YaHei",system-ui,sans-serif}header{height:70px;border-bottom:1px solid #d7dfd8;display:flex;align-items:center;padding:0 max(5vw,22px);gap:12px;background:#fff}header b{background:#16543e;color:white;padding:3px 10px;border-radius:9px;font-size:22px}header small{margin-left:auto;color:#64736b}main{max-width:820px;margin:clamp(34px,7vh,78px) auto;padding:0 20px 40px}h1{font-size:clamp(30px,5vw,49px);letter-spacing:-.055em;line-height:1.17;margin:18px 0 28px}h2{font-size:20px;margin:0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #c6d4c9;color:#20513c;background:white;border-radius:24px;padding:9px 17px}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #599776;outline-offset:3px}.primary{background:#18573f;color:white;border-color:#18573f}.panel,article{background:white;border:1px solid #d6e0d7;border-radius:18px;padding:24px}.panel{border-top:4px solid #256046}textarea{width:100%;resize:vertical;min-height:115px;background:#fafbf9;border:1px solid #c9d5cd;border-radius:9px;padding:14px;margin:12px 0;color:inherit}.actions,.item,.line{display:flex;align-items:center;gap:14px;justify-content:space-between}.muted,dt{color:#617168;font-size:14px}.sample{font-size:14px;border:0;padding:4px 0;border-radius:0;color:#246946;text-decoration:underline;text-underline-offset:4px}.back{padding:4px 0;border:0;background:transparent}.list{display:grid;gap:12px}article{display:flex;align-items:center;gap:18px}.index{color:#567960;font:20px Georgia,serif}.info{flex:1;min-width:0}.info p{margin:5px 0}a{color:#18573f;text-decoration:none}.link{white-space:nowrap;border:1px solid #c6d4c9;padding:7px 12px;border-radius:22px}dl{margin:0}.line{align-items:baseline;padding:14px 0;border-bottom:1px solid #e5eae5}.line:last-child{border:0}dd{margin:0;text-align:right;max-width:74%}footer{margin-top:26px;color:#67736a;font-size:13px}[hidden]{display:none!important}@media(max-width:540px){header{height:58px}article,.panel{padding:17px}article{gap:10px}.actions{align-items:flex-start;flex-direction:column}.link{font-size:14px}h2{font-size:17px}}
.location{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}.location label{flex:1;min-width:150px;font-size:14px}.location input{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #c6d4c9;border-radius:8px;font:inherit}details{margin-top:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.55}</style></head><body><header><b aria-hidden="true">↗</b><strong>导航助手</strong><small>2026-11-11-8 · 非导航态</small></header><main>
<section id="home"><h1>想去哪里？</h1><form class="panel" id="form"><div class="location"><label>测试城市<input id="city" value="上海" maxlength="80"></label><label>当前位置附近的地标<input id="anchor" placeholder="例如：中山公园" maxlength="120"></label></div><label for="cmd"><strong>输入指令</strong></label><textarea id="cmd" required placeholder="帮我推荐中山公园附近的美食"></textarea><div class="actions"><button class="sample" type="button" id="fill">试试「中山公园附近的美食」</button><button class="primary">查找地点 →</button></div><p id="status" role="status"></p></form></section>
<section id="results" hidden><a class="back" href="#home">← 返回输入</a><h1>附近地点</h1><p id="query"></p><p class="muted"><span id="summary" role="status"></span></p><div class="list" id="list"></div></section>
<section id="detail" hidden><a class="back" href="#results">← 返回地点列表</a><p class="muted" id="category"></p><h1 id="name"></h1><div class="panel"><h2>地点详情</h2><dl id="fields"></dl></div></section>
<details id="debug" hidden><summary>查看语义 JSON</summary><pre id="json"></pre><button id="copy">复制 JSON</button></details></main>
<script>
const el=id=>document.getElementById(id);
let places=[],previous=null;
function clean(value){
  if(typeof value!=='number' && typeof value!=='string')return '';
  const text=String(value).trim();
  return /^(暂无(数据|信息)?|未提供|无数据|null|undefined|--|设施信息未提供)$/.test(text)?'':text;
}
function unit(value,suffix){return clean(value)?clean(value)+suffix:''}
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function drawList(){
  el('list').replaceChildren(...places.map((p,i)=>{
    const card=node('article',''), info=node('div','','info'), link=node('a','详情 ›','link');
    info.append(node('h2',p.name));
    const meta=[unit(p.rating,' 分'),clean(p.category),unit(p.cost,' 元/人')].filter(Boolean);
    if(meta.length)info.append(node('p',meta.join(' · ')));
    if(clean(p.distance))info.append(node('small','距搜索中心 '+p.distance+' 米','muted'));
    link.href='#place-'+(i+1);
    card.append(node('span',String(i+1).padStart(2,'0'),'index'),info,link);
    return card;
  }));
}
function render(){
  const match=/^#place-([1-9]\d*)$/.exec(location.hash);
  const p=match && places[Number(match[1])-1];
  const view=p?'detail':location.hash==='#results' && previous?'results':'home';
  for(const id of ['home','results','detail'])el(id).hidden=id!==view;
  if(p){
    el('name').textContent=p.name;el('category').textContent=clean(p.category);
    el('fields').replaceChildren();
    const fields=[['高德评分',unit(p.rating,' 分')],['人均消费',unit(p.cost,' 元')],['地址',p.address],['距搜索中心',unit(p.distance,' 米')],['营业时间',p.hours],['联系电话',p.phone],['停车场类型',p.parking],['关联设施',(p.facilities||[]).map(clean).filter(Boolean).join('、')]];
    for(const [label,value] of fields){
      if(!clean(value))continue;
      const row=node('div','','line');row.append(node('dt',label),node('dd',value));el('fields').append(row);
    }
    el('fields').parentElement.hidden=!el('fields').children.length;
  }
  window.scrollTo(0,0);
}
async function post(route,body){
  const res=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();if(!res.ok)throw Error(data.error || 'HTTP '+res.status);return data;
}
el('fill').onclick=()=>{el('cmd').value='帮我推荐中山公园附近的美食';el('cmd').focus()};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('json').textContent);el('copy').textContent='已复制'}catch{el('copy').textContent='请选中 JSON 后复制'}};
el('form').onsubmit=async e=>{
  e.preventDefault();
  const text=el('cmd').value.trim();if(!text)return;
  const home={city:el('city').value.trim(),anchor:el('anchor').value.trim()};
  const candidates=places.map(({candidate_id,list_version,ordinal,name})=>({candidate_id,list_version,ordinal,name}));
  const submit=el('form').querySelector('.primary');
  if(submit.disabled)return;
  submit.disabled=true;el('status').textContent='正在解析…';
  try{
    const frame=await post('/parse',{text,previous,parseOnly:true,home:{...home,candidates}});
    previous=frame;el('debug').hidden=false;el('copy').textContent='复制 JSON';el('json').textContent=JSON.stringify(frame,null,2);
    el('cmd').value='';
    if(['select','details'].includes(frame.intent)){
      const ref=frame.target?.reference;
      const index=places.findIndex(p=>ref?.candidate_id?p.candidate_id===ref.candidate_id:p.ordinal===ref?.ordinal);
      if(index>=0){el('status').textContent='';location.hash='place-'+(index+1);return}
    }
    if(!frame.ready || !['search','modify_search','list'].includes(frame.intent)){
      if(['reset_session','cancel_search'].includes(frame.intent)||frame.dialogue?.relation==='new_task'){places=[];drawList()}
      el('status').textContent=frame.follow_up || '本轮已处理。';return;
    }
    places=[];drawList();el('query').textContent=text;el('summary').textContent='正在查询高德…';el('status').textContent='';
    location.hash='results';
    try{
      const result=await post('/search',{frame,home});places=result.places;drawList();el('summary').textContent=result.message;
    }catch(error){el('summary').textContent='地点查询失败：'+error.message}
  }catch(error){el('status').textContent='解析失败：'+error.message}finally{submit.disabled=false}
};
el('cmd').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')el('form').requestSubmit()};
window.addEventListener('hashchange',render);render();
</script></body></html>
